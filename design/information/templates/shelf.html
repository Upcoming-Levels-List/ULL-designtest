<!--meta
title: Shelf
tag: weighted blocks, popup reader
files: js/pages/Information.js · css/pages/information.css
state: click any block
idea: The whole page is a shelf of blocks sized by how much is behind them, and nothing else. Click one and it opens the reader over the page &mdash; the same window C and E open, so the three differ only in the surface in front of it. Closed, the seven blocks fit on one screen and each states its own size: &ldquo;5 groups &middot; 13 sections&rdquo;, &ldquo;14 questions&rdquo;, &ldquo;9 endpoints&rdquo;, &ldquo;10 colours&rdquo;. You choose what to read before anything is read at you, and you come back to exactly the shelf you left.
weight: Column span, set once: the guidelines take eight of twelve, the FAQ four, the three middle blocks four each, and the two legends are small cards on a &ldquo;Reference&rdquo; row of their own beneath the shelf, sized to their contents. A legend cannot read as a peer of the rulebook when it is a sixth of its area and sitting under a different heading.
cost: Small. One grid, one modal component reused seven times, and the modal is where every long read lives &mdash; so the page itself never grows past one screen no matter how much the guidelines gain. The nested scroll pane and the IntersectionObserver that patches it both go.
watch: Everything is behind a click, so a reader who does not know which block holds their answer has to guess, and search has to cover the closed blocks or it is decoration. A modal also needs a URL of its own (?open=api) or a rule cannot be linked, and Back must close it rather than leave the page.
-->
